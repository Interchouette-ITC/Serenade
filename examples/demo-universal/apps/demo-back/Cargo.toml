[package]
name = "serenade-demo-back"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.serenade]
name = "demo-universal"
mode = "universal"

[dependencies]
serenade-demo-contract = { path = "../../libs/demo-contract" }
serenade-demo-ui = { path = "../../../demo-monorepo/libs/demo-ui", default-features = false, features = ["ssr"] }
leptos = { version = "0.8", default-features = false, features = ["ssr"] }
serenade-http = { path = "../../../../crates/serenade-http" }
serenade-http-actix = { path = "../../../../crates/serenade-http-actix" }
serenade-kernel = { path = "../../../../crates/serenade-kernel" }
hydration_context = "0.3.2"
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
