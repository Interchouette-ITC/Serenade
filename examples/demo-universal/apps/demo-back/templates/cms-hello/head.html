<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title head-key="title:primary">{{ route_title }}</title>
<meta
    head-key="meta:name:description"
    name="description"
    [content]="route_description"
/>
<link head-key="link:canonical" rel="canonical" [href]="route_canonical" />

<meta property="og:image" content="/serenade-banner.png" />
<meta property="og:image" [content]="route_social_image" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="stylesheet" href="/style.css" />
<script type="application/ld+json" data-serenade-head="ssr">{{ json_ld }}</script>
