[package]
name = "serenade-demo-front"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr", "hydrate"] }
serenade-demo-contract = { path = "../../libs/demo-contract" }
serenade-demo-ui = { path = "../../../demo-monorepo/libs/demo-ui", default-features = false, features = ["hydrate"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Response", "Location"] }
