# Manual dev pre-release of the Serenade CLI binaries.
# Moves tag/Release `serenade-cli-dev` to the dispatched `dev` commit and replaces its
# assets with static Linux binaries (serenade-cli + Trunk from the fork's rolling
# `trunk-itc-dev` release), so site deploys can download them instead of compiling.
# Asset names are stable (not SemVer).
name: release-cli-dev

on:
  workflow_dispatch:

permissions:
  contents: write
  # `gh attestation verify` reads the Trunk fork's attestations with GITHUB_TOKEN.
  attestations: read

concurrency:
  group: release-cli-dev
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: serenade-cli-dev
  TARGET: x86_64-unknown-linux-musl
  TRUNK_RELEASE_URL: https://github.com/Interchouette-ITC/trunk/releases/download/trunk-itc-dev

jobs:
  release:
    name: Build and publish serenade-cli-dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require dev
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "release-cli-dev only runs on dev (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Build serenade-cli
        run: cargo build --release --locked -p serenade-cli --target "$TARGET"

      # Same artifact serenade-cli installs at runtime; verified (checksum + build
      # provenance attestation from the fork's release workflow), never recompiled here.
      - name: Download Trunk (trunk-itc-dev)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUNK_REPO: Interchouette-ITC/trunk
        run: |
          set -euo pipefail
          ASSET="trunk-${TARGET}.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${ASSET}" "${TRUNK_RELEASE_URL}/${ASSET}"
          TRUNK_SHA256="$(curl -fsSL --retry 3 "${TRUNK_RELEASE_URL}/${ASSET}.sha256" | awk '{print $1}')"
          echo "${TRUNK_SHA256}  ${RUNNER_TEMP}/${ASSET}" | sha256sum -c -
          TRUNK_COMMIT="$(gh attestation verify "${RUNNER_TEMP}/${ASSET}" \
            --repo "$TRUNK_REPO" \
            --signer-workflow "${TRUNK_REPO}/.github/workflows/release.yaml" \
            --source-ref refs/heads/main \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json \
            --jq "[.[].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[]? | select((.uri // \"\") | startswith(\"git+https://github.com/${TRUNK_REPO}@\")) | .digest.gitCommit // empty][0]")"
          [[ "$TRUNK_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "no attested commit for ${ASSET}"; exit 1; }
          INSTALL_DIR="${RUNNER_TEMP}/serenade-tools/trunk-itc-dev"
          mkdir -p "${INSTALL_DIR}/bin"
          tar -xzf "${RUNNER_TEMP}/${ASSET}" -C "${INSTALL_DIR}/bin" trunk
          echo "$TRUNK_SHA256" > "${INSTALL_DIR}/.serenade-trunk-sha256"
          sha256sum "${INSTALL_DIR}/bin/trunk" | awk '{print $1}' > "${INSTALL_DIR}/.serenade-trunk-bin-sha256"
          TRUNK_VERSION="$("${INSTALL_DIR}/bin/trunk" --version)"
          case "$TRUNK_VERSION" in "trunk "?*"+itc."?*) ;; *) echo "missing fork build revision: $TRUNK_VERSION"; exit 1 ;; esac
          TRUNK_REVISION="${TRUNK_VERSION##*+itc.}"
          case "$TRUNK_COMMIT" in "$TRUNK_REVISION"*) ;; *) echo "${TRUNK_VERSION} was not built from attested commit ${TRUNK_COMMIT}"; exit 1 ;; esac
          echo "$TRUNK_VERSION" > "${INSTALL_DIR}/.serenade-trunk-version"
          printf 'commit %s\nsigner https://github.com/%s/.github/workflows/release.yaml@refs/heads/main\n' \
            "$TRUNK_COMMIT" "$TRUNK_REPO" > "${INSTALL_DIR}/.serenade-trunk-provenance"
          echo "TRUNK_SHA256=${TRUNK_SHA256}" >> "$GITHUB_ENV"
          echo "TRUNK_VERSION=${TRUNK_VERSION}" >> "$GITHUB_ENV"
          echo "TRUNK_COMMIT=${TRUNK_COMMIT}" >> "$GITHUB_ENV"
          echo "Trunk: ${TRUNK_VERSION} (sha256 ${TRUNK_SHA256}, provenance verified: ${TRUNK_COMMIT})"

      - name: Package binaries
        run: |
          set -euo pipefail
          BIN_DIR="target/${TARGET}/release"
          ARCHIVE="serenade-cli-${TARGET}.tar.gz"
          BINS=(serenade serenade-spa serenade-html serenade-universal serenade-ssg serenade-trunk)
          for bin in "${BINS[@]}"; do
            test -x "${BIN_DIR}/${bin}"
          done
          "${BIN_DIR}/serenade-ssg" --help > /dev/null
          mkdir -p dist
          tar -czf "dist/${ARCHIVE}" -C "$BIN_DIR" "${BINS[@]}"
          (cd dist && sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256")

          TRUNK_ARCHIVE="serenade-trunk-${TARGET}.tar.gz"
          tar -czf "dist/${TRUNK_ARCHIVE}" -C "${RUNNER_TEMP}/serenade-tools" trunk-itc-dev
          (cd dist && sha256sum "$TRUNK_ARCHIVE" > "${TRUNK_ARCHIVE}.sha256")
          ls -la dist

      - name: Point serenade-cli-dev at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short "$SHA")"
          NOTES="Serenade CLI built from \`dev\` @ \`${SHORT}\` (\`${SHA}\`).

          Rolling dev pre-release, moved on each run of \`release-cli-dev\`. Not versioned.

          ## Install

          \`\`\`sh
          mkdir -p \"\$HOME/.local/bin\"
          curl -fsSL https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/serenade-cli-${TARGET}.tar.gz | tar -xz -C \"\$HOME/.local/bin\"
          export PATH=\"\$HOME/.local/bin:\$PATH\"
          mkdir -p \"\$HOME/.serenade/tools\"
          curl -fsSL https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/serenade-trunk-${TARGET}.tar.gz | tar -xz -C \"\$HOME/.serenade/tools\"
          \`\`\`

          \`serenade-cli-${TARGET}.tar.gz\` contains \`serenade\`, \`serenade-spa\`, \`serenade-html\`, \`serenade-universal\`, \`serenade-ssg\` and \`serenade-trunk\` (static ${TARGET}).

          \`serenade-trunk-${TARGET}.tar.gz\` contains \`${TRUNK_VERSION}\` from the Trunk fork's \`trunk-itc-dev\` release (sha256 \`${TRUNK_SHA256}\`, build provenance attested for commit \`${TRUNK_COMMIT}\`) in serenade-cli's install layout (\`trunk-itc-dev/bin/trunk\` + release checksum, binary checksum, version and provenance markers). It is optional: serenade-cli downloads and verifies the same binary on first use. Extract it into \`\$SERENADE_HOME/tools\` (default \`~/.serenade/tools\`) to skip that download."

          git tag -f "$RELEASE_TAG" "$SHA"
          git push -f origin "refs/tags/${RELEASE_TAG}"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease --title "serenade-cli dev" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" --prerelease --title "serenade-cli dev" --notes "$NOTES" --verify-tag
          fi

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset_list="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            gh release delete-asset "$RELEASE_TAG" "$name" --yes
          done <<< "$asset_list"
          gh release upload "$RELEASE_TAG" dist/* --clobber
