# Manual dev pre-release of the Serenade CLI binaries.
# Moves tag/Release `serenade-cli-dev` to the dispatched `dev` commit and replaces its
# assets with static Linux binaries (serenade-cli + the pinned Trunk), so site deploys
# can download them instead of compiling. Asset names are stable (not SemVer).
name: release-cli-dev

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-cli-dev
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: serenade-cli-dev
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    name: Build and publish serenade-cli-dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require dev
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "release-cli-dev only runs on dev (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Build serenade-cli
        run: cargo build --release --locked -p serenade-cli --target "$TARGET"

      # Temporary until the Trunk fork publishes its own binaries: build the Trunk
      # tag pinned in serenade-cli and package it in serenade-ssg's install layout.
      - name: Resolve pinned Trunk tag
        run: |
          set -euo pipefail
          TRUNK_TAG="$(sed -n 's/^const TRUNK_TAG: &str = "\(.*\)";$/\1/p' crates/serenade-cli/src/trunk.rs)"
          test -n "$TRUNK_TAG"
          echo "TRUNK_TAG=${TRUNK_TAG}" >> "$GITHUB_ENV"
          echo "Pinned Trunk: ${TRUNK_TAG}"

      - name: Build pinned Trunk
        run: |
          set -euo pipefail
          INSTALL_DIR="${RUNNER_TEMP}/serenade-tools/trunk-${TRUNK_TAG}"
          cargo install --root "$INSTALL_DIR" \
            --git https://github.com/Interchouette-ITC/trunk.git --tag "$TRUNK_TAG" \
            --locked --force --target "$TARGET" trunk
          echo "$TRUNK_TAG" > "${INSTALL_DIR}/.serenade-trunk-tag"
          "${INSTALL_DIR}/bin/trunk" --version

      - name: Package binaries
        run: |
          set -euo pipefail
          BIN_DIR="target/${TARGET}/release"
          ARCHIVE="serenade-cli-${TARGET}.tar.gz"
          BINS=(serenade serenade-spa serenade-html serenade-universal serenade-ssg serenade-trunk)
          for bin in "${BINS[@]}"; do
            test -x "${BIN_DIR}/${bin}"
          done
          "${BIN_DIR}/serenade-ssg" --help > /dev/null
          mkdir -p dist
          tar -czf "dist/${ARCHIVE}" -C "$BIN_DIR" "${BINS[@]}"
          (cd dist && sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256")

          TRUNK_ARCHIVE="serenade-trunk-${TARGET}.tar.gz"
          tar -czf "dist/${TRUNK_ARCHIVE}" -C "${RUNNER_TEMP}/serenade-tools" "trunk-${TRUNK_TAG}"
          (cd dist && sha256sum "$TRUNK_ARCHIVE" > "${TRUNK_ARCHIVE}.sha256")
          ls -la dist

      - name: Point serenade-cli-dev at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short "$SHA")"
          NOTES="Serenade CLI built from \`dev\` @ \`${SHORT}\` (\`${SHA}\`).

          Rolling dev pre-release, moved on each run of \`release-cli-dev\`. Not versioned.

          ## Install

          \`\`\`sh
          mkdir -p \"\$HOME/.local/bin\"
          curl -fsSL https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/serenade-cli-${TARGET}.tar.gz | tar -xz -C \"\$HOME/.local/bin\"
          export PATH=\"\$HOME/.local/bin:\$PATH\"
          mkdir -p \"\$HOME/.serenade/tools\"
          curl -fsSL https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/serenade-trunk-${TARGET}.tar.gz | tar -xz -C \"\$HOME/.serenade/tools\"
          \`\`\`

          \`serenade-cli-${TARGET}.tar.gz\` contains \`serenade\`, \`serenade-spa\`, \`serenade-html\`, \`serenade-universal\`, \`serenade-ssg\` and \`serenade-trunk\` (static ${TARGET}).

          \`serenade-trunk-${TARGET}.tar.gz\` contains the pinned Trunk \`${TRUNK_TAG}\` in serenade-ssg's install layout (\`trunk-${TRUNK_TAG}/bin/trunk\` + tag marker), so it is used instead of compiling Trunk. Extract it into \`\$SERENADE_HOME/tools\` (default \`~/.serenade/tools\`)."

          git tag -f "$RELEASE_TAG" "$SHA"
          git push -f origin "refs/tags/${RELEASE_TAG}"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease --title "serenade-cli dev" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" --prerelease --title "serenade-cli dev" --notes "$NOTES" --verify-tag
          fi

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset_list="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            gh release delete-asset "$RELEASE_TAG" "$name" --yes
          done <<< "$asset_list"
          gh release upload "$RELEASE_TAG" dist/* --clobber
