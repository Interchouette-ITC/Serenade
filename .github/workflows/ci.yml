name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Action runtimes: Node 24+ (checkout v7, codecov-action v6; FORCE_JAVASCRIPT_ACTIONS_TO_NODE24).
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "**"
              - "!**/*.md"

  lint:
    name: fmt · clippy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping heavy lint"
      - uses: dtolnay/rust-toolchain@nightly
        if: needs.changes.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: make lint
      - name: Lint serenade-cache redis feature
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo +nightly clippy -p serenade-cache --all-targets --locked --features redis
          -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery
      - name: Lint serenade-lock redis feature
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo +nightly clippy -p serenade-lock --all-targets --locked --features redis
          -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery
      - name: Lint serenade-messenger redis feature
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo +nightly clippy -p serenade-messenger --all-targets --locked --features redis
          -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery
      - name: Lint serenade-rate-limiter redis feature
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo +nightly clippy -p serenade-rate-limiter --all-targets --locked --features redis
          -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery
      - name: Lint serenade-serializer toon feature
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo +nightly clippy -p serenade-serializer --all-targets --locked --features toon
          -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery
      - name: Lint serenade-scheduler messenger feature
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo +nightly clippy -p serenade-scheduler --all-targets --locked --features messenger
          -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery
      - name: Lint serenade-observability otel feature
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo +nightly clippy -p serenade-observability --all-targets --locked --features otel
          -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery
      - name: Lint serenade-openapi actix feature
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo +nightly clippy -p serenade-openapi --all-targets --locked --features actix
          -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery
      - name: Lint serenade-security oauth feature
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo +nightly clippy -p serenade-security --all-targets --locked --features oauth
          -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery
      - name: Lint serenade-security ldap feature
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo +nightly clippy -p serenade-security --all-targets --locked --features ldap
          -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery
      - name: Lint serenade-mailer esp feature
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo +nightly clippy -p serenade-mailer --all-targets --locked --features esp
          -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery
      - name: Lint serenade-search http feature
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo +nightly clippy -p serenade-search --all-targets --locked --features http
          -- -D warnings -D clippy::all -D clippy::pedantic -D clippy::nursery

  test:
    name: workspace tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping heavy tests"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: make test
      - name: Test serenade-scheduler with messenger
        if: needs.changes.outputs.code == 'true'
        run: cargo +stable test -p serenade-scheduler --locked --features messenger
      - name: Test serenade-observability with otel
        if: needs.changes.outputs.code == 'true'
        run: cargo +stable test -p serenade-observability --locked --features otel
      - name: Test serenade-openapi with actix
        if: needs.changes.outputs.code == 'true'
        run: cargo +stable test -p serenade-openapi --locked --features actix
      - name: Test serenade-security with oauth
        if: needs.changes.outputs.code == 'true'
        run: cargo +stable test -p serenade-security --locked --features oauth
      - name: Test serenade-security with ldap
        if: needs.changes.outputs.code == 'true'
        run: cargo +stable test -p serenade-security --locked --features ldap
      - name: Test serenade-mailer with esp
        if: needs.changes.outputs.code == 'true'
        run: cargo +stable test -p serenade-mailer --locked --features esp
      - name: Test serenade-search with http
        if: needs.changes.outputs.code == 'true'
        run: cargo +stable test -p serenade-search --locked --features http

  front-mode-demos:
    name: HTML, SPA, SSG and Universal demos
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Check demo-html
        run: cargo +stable check -p serenade-demo-html --locked
      - name: Build demo-spa
        run: make spa
      - name: Build and prerender demo-ssg
        run: make ssg
      - name: Verify prerendered routes
        run: |
          grep -q 'Hello from Serenade' examples/demo-monorepo/apps/demo-ssg/dist/index.html
          grep -q 'About Serenade' examples/demo-monorepo/apps/demo-ssg/dist/about/index.html
      - name: Build Universal frontend
        run: cd examples/demo-universal/apps/demo-front && trunk build
      - name: Build Universal backend
        run: cargo +stable check --manifest-path examples/demo-universal/Cargo.toml --workspace --locked
      - name: Smoke test Universal server
        run: |
          SERENADE_UNIVERSAL_BIND=127.0.0.1:8080 cargo +stable run --manifest-path examples/demo-universal/Cargo.toml -p serenade-demo-back --locked &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/hello > /tmp/hello.json; then break; fi
            sleep 1
          done
          grep -q 'Hello from the Serenade backend!' /tmp/hello.json
          curl --fail --silent http://127.0.0.1:8080/cms/hello | tee /tmp/cms-hello.html
          grep -q '<h1>Hello from Serenade</h1>' /tmp/cms-hello.html
          grep -q 'Clicked 0 times' /tmp/cms-hello.html
          curl --fail --silent http://127.0.0.1:8080/favicon.ico --output /tmp/favicon.ico
          test -s /tmp/favicon.ico
          curl --fail --silent http://127.0.0.1:8080/serenade-demo-front.js --output /tmp/universal.js
          test -s /tmp/universal.js

  cache-redis:
    name: cache redis
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping redis cache tests"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Test serenade-cache with redis
        if: needs.changes.outputs.code == 'true'
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: cargo +stable test -p serenade-cache --locked --features redis
      - name: Test serenade-lock with redis
        if: needs.changes.outputs.code == 'true'
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: cargo +stable test -p serenade-lock --locked --features redis
      - name: Test serenade-messenger with redis
        if: needs.changes.outputs.code == 'true'
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: cargo +stable test -p serenade-messenger --locked --features redis
      - name: Test serenade-rate-limiter with redis
        if: needs.changes.outputs.code == 'true'
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: cargo +stable test -p serenade-rate-limiter --locked --features redis

  serializer-toon:
    name: serializer toon
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping toon serializer tests"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Test serenade-serializer with toon
        if: needs.changes.outputs.code == 'true'
        run: cargo +stable test -p serenade-serializer --locked --features toon

  doc:
    name: rustdoc
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping rustdoc"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Doc
        if: needs.changes.outputs.code == 'true'
        run: make doc
      - name: Github pages
        if: >-
          needs.changes.outputs.code == 'true'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs/api-rust
          branch: gh-pages
          clean: true
          commit-message: "Deploy documentation for ${{ github.sha }}"

  supply-chain:
    name: supply-chain
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping supply-chain"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.code == 'true'
        with:
          tool: cargo-audit@0.22.0,cargo-deny@0.20.2
      - name: Cargo audit and deny
        if: needs.changes.outputs.code == 'true'
        run: make audit && make deny

  deps:
    name: unused deps
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping machete"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.code == 'true'
        with:
          tool: cargo-machete@0.9.2
      - name: Machete
        if: needs.changes.outputs.code == 'true'
        run: make machete

  geiger:
    name: geiger
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping geiger"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Install jq
        if: needs.changes.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq
      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.code == 'true'
        with:
          tool: cargo-geiger@0.13.0
      - name: Geiger budget
        if: needs.changes.outputs.code == 'true'
        run: make geiger
      - name: Job summary
        if: always() && needs.changes.outputs.code == 'true'
        run: |
          if [ -f target/geiger/summary.md ]; then
            cat target/geiger/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload geiger report
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: geiger-report
          path: |
            target/geiger/report.json
            target/geiger/summary.md
          if-no-files-found: warn

  coverage:
    name: coverage
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping coverage"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Install cargo-llvm-cov
        if: needs.changes.outputs.code == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Coverage
        if: needs.changes.outputs.code == 'true'
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: make coverage
      - name: Upload to Codecov
        if: needs.changes.outputs.code == 'true'
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
