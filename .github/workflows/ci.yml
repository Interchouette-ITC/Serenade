name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "**"
              - "!**/*.md"

  lint:
    name: fmt · clippy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping heavy lint"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: make lint

  test:
    name: workspace tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping heavy tests"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: make test

  doc:
    name: rustdoc
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping rustdoc"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Doc
        if: needs.changes.outputs.code == 'true'
        run: make doc

  supply-chain:
    name: supply-chain
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping supply-chain"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Install cargo-audit and cargo-deny
        if: needs.changes.outputs.code == 'true'
        run: |
          cargo install --locked cargo-audit --version 0.22.0
          cargo install --locked cargo-deny --version 0.20.2
      - name: Cargo audit and deny
        if: needs.changes.outputs.code == 'true'
        run: make audit && make deny
