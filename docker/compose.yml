services:
  myfeed:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: interchouette/serenade-myfeed:latest
    ports:
      - '8080:8080'
    environment:
      MYFEED_BIND: 0.0.0.0:8080
      MYFEED_DB: /data/myfeed.sqlite
      MYFEED_CSRF_SECRET: '${MYFEED_CSRF_SECRET:-myfeed-dev-csrf-secret-change-me!!}'
      MYFEED_ADMIN_TOKEN: '${MYFEED_ADMIN_TOKEN:-myfeed-dev-admin}'
    volumes:
      - myfeed-data:/data
    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  myfeed-data:
