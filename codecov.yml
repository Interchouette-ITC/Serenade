# Paths excluded from Codecov totals (demo app, CLI, console TUI/debug).
# Plain folder/file paths only (Codecov treats entries as regex; avoid ** bombs).
# Upload token stays in GitHub Actions secrets, not here.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "examples"
  - "crates/serenade-cli"
  - "crates/serenade-console/src/interactive.rs"
  - "crates/serenade-console/src/commands"
