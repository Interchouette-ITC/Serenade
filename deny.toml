# cargo-deny configuration (run: `make deny`)
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
yanked = "warn"
# actix-http 3.x depends on h2 0.3; the fix is only published on h2 >= 0.4.16.
ignore = [
    { id = "RUSTSEC-2026-0258", reason = "actix-http 3.x pins h2 0.3; patched line is h2 0.4.x only" },
    # Transitive via wasmer 7 / wasmer-wasix (serenade-sandbox); no safe upgrade upstream yet.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; pulled by wasmer-compiler via linker-utils" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; pulled by wasmer-derive" },
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; pulled by wasmer-wasix stack" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained; pulled by serde_yaml (config + wasmer)" },
    { id = "RUSTSEC-2026-0441", reason = "Unmaintained pin-utils crate, transitively required by [DEPENDENCY]. No compatible upstream replacement currently available." },
    # chrono stays private to serenade-scheduler (cron's schedule API) and comes in via wasmer-config (saffron).
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; required by cron 0.17 and wasmer-config (saffron); no chrono-free cron yet" },
    { id = "RUSTSEC-2026-0594", reason = "RUSTSEC-2026-0594: actix-web 4.20.0 pins cookie 0.16.2; no compatible upstream fix yet" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash is transitively required by [DEPENDENCY]; no compatible upstream replacement currently available" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "OSL-3.0",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

# wasmer-config → saffron uses license-file only (BSD-3-Clause text in LICENSE).
exceptions = [{ crate = "saffron", allow = ["BSD-3-Clause"] }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
