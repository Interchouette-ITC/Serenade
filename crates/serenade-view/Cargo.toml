[package]
name = "serenade-view"
description = "HTML view helpers: path, asset, partials (no template engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
any_spawner = { version = "0.3", optional = true }
base64 = { workspace = true }
futures = { version = "0.3", optional = true }
hydration_context = { version = "0.3.2", default-features = false, optional = true }
leptos = { version = "0.8", default-features = false, optional = true }
leptos_meta = { version = "0.8", default-features = false, optional = true }
serenade-form = { workspace = true }
serenade-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[features]
leptos-client = ["dep:leptos", "dep:leptos_meta", "leptos/hydrate"]
leptos-ssr = [
    "dep:any_spawner",
    "dep:futures",
    "dep:hydration_context",
    "dep:leptos",
    "dep:leptos_meta",
    "leptos/ssr",
    "leptos_meta/ssr",
]

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
    "Comment",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlHeadElement",
    "Node",
    "NodeList",
    "Window",
] }

[lints]
workspace = true
