[package]
name = "serenade-messenger"
description = "Sync message bus, middleware, and async transport adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
## Enable [`crate::RedisTransport`] via redis-rs + r2d2.
redis = ["dep:redis", "dep:r2d2"]

[dependencies]
thiserror = { workspace = true }
redis = { version = "0.27", optional = true, default-features = false, features = [
    "r2d2",
] }
r2d2 = { version = "0.8", optional = true }

[dev-dependencies]
insta = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
