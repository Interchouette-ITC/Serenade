id = "framework"
description = "Framework package config and registration hints"

[cargo]
dependencies = [
  { crate = "serenade-bundle", version = "1.0.0" },
  { crate = "serenade-kernel", version = "1.0.0" },
  { crate = "serenade-config", version = "1.0.0" },
  { crate = "serenade-console", version = "1.0.0" },
  { crate = "serenade-di", version = "1.0.0" },
  { crate = "serenade-event", version = "1.0.0" },
  { crate = "serenade-http", version = "1.0.0" },
]

[[files]]
src = "files/config/packages/framework.toml"
dest = "config/packages/framework.toml"

[hints]
bundles = ["FrameworkBundle"]
note = "Register FrameworkBundle and load FrameworkExtension (see docs-dev/RECIPES.md)."
