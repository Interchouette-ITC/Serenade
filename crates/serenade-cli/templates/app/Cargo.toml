[package]
name = "__PACKAGE_NAME__"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "__PACKAGE_NAME__"
path = "src/main.rs"

[dependencies]
serenade-bundle = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
serenade-config = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
serenade-console = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
serenade-di = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
serenade-event = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
serenade-http = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }
serenade-kernel = { git = "https://github.com/Interchouette-ITC/Serenade.git", branch = "dev" }

# Scaffold keeps these for recipe wiring even when the default main does not import them yet.
[package.metadata.cargo-machete]
ignored = ["serenade-di", "serenade-event", "serenade-http"]
