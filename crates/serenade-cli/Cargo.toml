[package]
name = "serenade-cli"
description = "Serenade CLI: Flex-like recipes and app scaffolding (Cargo remains the package manager)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "serenade"
path = "src/main.rs"

[[bin]]
name = "serenade-spa"
path = "src/bin/serenade-spa.rs"

[[bin]]
name = "serenade-html"
path = "src/bin/serenade-html.rs"

[[bin]]
name = "serenade-universal"
path = "src/bin/serenade-universal.rs"

[[bin]]
name = "serenade-ssg"
path = "src/bin/serenade-ssg.rs"

[[bin]]
name = "serenade-trunk"
path = "src/bin/serenade-trunk.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
cling = { workspace = true }
crossterm = { workspace = true }
flate2 = "1"
include_dir = { workspace = true }
ratatui = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serenade-minify = { workspace = true }
serenade-view = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sigstore-trust-root = "0.16"
sigstore-types = "0.16"
sigstore-verify = "0.16"
snap = "1"
tar = "0.4"
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
walkdir = { workspace = true }
zip = { version = "9.6", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
