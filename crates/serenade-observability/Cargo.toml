[package]
name = "serenade-observability"
description = "Structured logging conventions: tracing init, channels, var/log file sinks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
## OpenTelemetry tracing bridge + optional OTLP/HTTP exporter.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
serenade-kernel = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
opentelemetry = { version = "0.31", optional = true, default-features = false, features = [
    "trace",
] }
opentelemetry_sdk = { version = "0.31", optional = true, default-features = false, features = [
    "trace",
] }
opentelemetry-otlp = { version = "0.31", optional = true, default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-client",
] }
tracing-opentelemetry = { version = "0.32", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
