[package]
name = "serenade-translation"
description = "Translator, message catalogues, locale negotiation, and ICU format helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["icu"]
## Locale-aware number / date helpers and CLDR plural categories (ICU4X).
icu = ["dep:icu_calendar", "dep:icu_decimal", "dep:icu_datetime", "dep:icu_plurals", "dep:icu_locale", "dep:writeable"]

[dependencies]
icu_calendar = { version = "2.0", optional = true, default-features = true }
icu_datetime = { version = "2.0", optional = true, default-features = true }
icu_decimal = { version = "2.0", optional = true, default-features = true }
icu_locale = { version = "2.0", optional = true, default-features = true }
icu_plurals = { version = "2.0", optional = true, default-features = true }
writeable = { version = "0.6", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serenade-bundle = { workspace = true }
serenade-config = { workspace = true }
serenade-di = { workspace = true }
serenade-http = { workspace = true }
serenade-kernel = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
