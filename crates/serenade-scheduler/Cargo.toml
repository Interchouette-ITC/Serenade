[package]
name = "serenade-scheduler"
description = "Symfony-shaped schedule definitions and a testable tick runner"
documentation = "https://docs.rs/serenade-scheduler"
keywords = ["serenade", "scheduler", "cron", "schedule", "tasks"]
categories = ["date-and-time", "web-programming"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
## Dispatch due jobs through [`serenade_messenger::MessageBus`].
messenger = ["dep:serenade-messenger"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
cron = "0.17"
serenade-console = { workspace = true }
serenade-di = { workspace = true }
serenade-kernel = { workspace = true }
serenade-messenger = { workspace = true, optional = true }
thiserror = { workspace = true }

[lints]
workspace = true
