[package]
name = "serenade-lock"
description = "Symfony-shaped lock contracts, LockFactory, and lock stores"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
## Enable [`crate::RedisLockStore`] via redis-rs + r2d2.
redis = ["dep:redis", "dep:r2d2"]

[dependencies]
serenade-di = { workspace = true }
thiserror = { workspace = true }
getrandom = { workspace = true }
redis = { version = "0.27", optional = true, default-features = false, features = [
    "r2d2",
] }
r2d2 = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
