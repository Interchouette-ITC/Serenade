[package]
name = "serenade-mailer"
description = "Email message, Mime lite types, and Null/File/SMTP transports"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["smtp"]
## Enable [`crate::SmtpTransport`] via lettre.
smtp = ["dep:lettre"]

[dependencies]
serenade-di = { workspace = true }
thiserror = { workspace = true }
lettre = { version = "0.11", optional = true, default-features = false, features = [
    "smtp-transport",
    "builder",
    "hostname",
    "rustls-tls",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
