[package]
name = "serenade-security"
description = "AuthN/Z hooks: users, tokens, voters, firewall, CSRF, and password hashing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
## OAuth 2.0 / OIDC relying-party helpers (not an authorization server).
oauth = ["dep:base64", "dep:serde", "dep:serde_json"]

[dependencies]
argon2 = { workspace = true }
base64 = { workspace = true, optional = true }
getrandom = { workspace = true }
hmac = { workspace = true }
serenade-http = { workspace = true }
serenade-session = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
