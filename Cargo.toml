[workspace]
members = [
    "crates/serenade-kernel",
    "crates/serenade-di",
    "crates/serenade-event",
    "crates/serenade-http",
    "crates/serenade-http-actix",
    "crates/serenade-config",
    "crates/serenade-contracts",
    "crates/serenade-bundle",
    "crates/serenade-console",
    "crates/serenade-cli",
    "crates/serenade-testing",
    "crates/serenade-messenger",
    "crates/serenade-serializer",
    "crates/serenade-validator",
    "crates/serenade-security",
    "crates/serenade-form",
    "crates/serenade-admin",
    "crates/serenade-cache",
    "crates/serenade-search",
    "crates/serenade-mailer",
    "crates/serenade-session",
    "crates/serenade-observability",
    "crates/serenade-component-host",
    "crates/serenade-sandbox",
    "crates/serenade-translation",
    "crates/serenade-profiler",
    "crates/serenade-view",
    "examples/demo-app",
    "examples/MyFeed",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
authors = ["Interchouette"]
repository = "https://github.com/Interchouette-ITC/Serenade"
rust-version = "1.85"

[workspace.dependencies]
serenade-kernel = { path = "crates/serenade-kernel", version = "0.1.0" }
serenade-di = { path = "crates/serenade-di", version = "0.1.0" }
serenade-event = { path = "crates/serenade-event", version = "0.1.0" }
serenade-http = { path = "crates/serenade-http", version = "0.1.0" }
serenade-http-actix = { path = "crates/serenade-http-actix", version = "0.1.0" }
serenade-config = { path = "crates/serenade-config", version = "0.1.0" }
serenade-contracts = { path = "crates/serenade-contracts", version = "0.1.0" }
serenade-bundle = { path = "crates/serenade-bundle", version = "0.1.0" }
serenade-console = { path = "crates/serenade-console", version = "0.1.0" }
serenade-cli = { path = "crates/serenade-cli", version = "0.1.0" }
serenade-testing = { path = "crates/serenade-testing", version = "0.1.0" }
serenade-messenger = { path = "crates/serenade-messenger", version = "0.1.0" }
serenade-serializer = { path = "crates/serenade-serializer", version = "0.1.0" }
serenade-validator = { path = "crates/serenade-validator", version = "0.1.0" }
serenade-security = { path = "crates/serenade-security", version = "0.1.0" }
serenade-form = { path = "crates/serenade-form", version = "0.1.0" }
serenade-admin = { path = "crates/serenade-admin", version = "0.1.0" }
serenade-cache = { path = "crates/serenade-cache", version = "0.1.0" }
serenade-search = { path = "crates/serenade-search", version = "0.1.0" }
serenade-mailer = { path = "crates/serenade-mailer", version = "0.1.0" }
serenade-session = { path = "crates/serenade-session", version = "0.1.0" }
serenade-observability = { path = "crates/serenade-observability", version = "0.1.0" }
serenade-component-host = { path = "crates/serenade-component-host", version = "0.1.0" }
serenade-sandbox = { path = "crates/serenade-sandbox", version = "0.1.0" }
serenade-translation = { path = "crates/serenade-translation", version = "0.1.0" }
serenade-profiler = { path = "crates/serenade-profiler", version = "0.1.0" }
serenade-view = { path = "crates/serenade-view", version = "0.1.0" }
actix-web = "4"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.3"
cling = "0.1.3"
crossterm = "0.28"
dotenvy = "0.15"
argon2 = "0.5"
getrandom = "0.3"
hmac = "0.12"
include_dir = "0.7"
ratatui = "0.30"
rustyline = { version = "18", features = ["with-file-history"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reddb-io-toon = "0.29.8"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rstest = "0.26"
mockall = "0.13"
insta = { version = "1", features = ["yaml"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "std",
    "ansi",
] }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
