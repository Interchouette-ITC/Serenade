[workspace]
members = [
    "crates/serenade-kernel",
    "crates/serenade-di",
    "crates/serenade-event",
    "crates/serenade-http",
    "crates/serenade-http-actix",
    "crates/serenade-config",
    "crates/serenade-contracts",
    "crates/serenade-bundle",
    "crates/serenade-console",
    "crates/serenade-cli",
    "crates/serenade-testing",
    "examples/demo-app",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
authors = ["Interchouette"]
repository = "https://github.com/Interchouette-ITC/Serenade"
rust-version = "1.77"

[workspace.dependencies]
serenade-kernel = { path = "crates/serenade-kernel", version = "0.1.0" }
serenade-di = { path = "crates/serenade-di", version = "0.1.0" }
serenade-event = { path = "crates/serenade-event", version = "0.1.0" }
serenade-http = { path = "crates/serenade-http", version = "0.1.0" }
serenade-http-actix = { path = "crates/serenade-http-actix", version = "0.1.0" }
serenade-config = { path = "crates/serenade-config", version = "0.1.0" }
serenade-contracts = { path = "crates/serenade-contracts", version = "0.1.0" }
serenade-bundle = { path = "crates/serenade-bundle", version = "0.1.0" }
serenade-console = { path = "crates/serenade-console", version = "0.1.0" }
serenade-cli = { path = "crates/serenade-cli", version = "0.1.0" }
serenade-testing = { path = "crates/serenade-testing", version = "0.1.0" }
actix-web = "4"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.3"
cling = "0.1.3"
crossterm = "0.28"
dotenvy = "0.15"
include_dir = "0.7"
ratatui = "0.30"
rustyline = { version = "18", features = ["with-file-history"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rstest = "0.26"
mockall = "0.13"
insta = { version = "1", features = ["yaml"] }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
